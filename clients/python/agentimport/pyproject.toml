[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentimport"
version = "0.1.0"
description = "Import AI assistant conversations into Prism search engine"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["prismsearch>=0.1.0", "pydantic>=2.0", "click>=8.0"]

[tool.uv.sources]
prismsearch = { path = "../prismsearch", editable = true }

[project.scripts]
agentimport = "agentimport.cli:main"

[project.optional-dependencies]
daemon = ["watchdog>=4.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.hatch.build.targets.wheel]
packages = ["src/agentimport"]

[tool.pytest.ini_options]
testpaths = ["tests"]
