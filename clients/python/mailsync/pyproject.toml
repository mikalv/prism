[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prism-mailsync"
version = "0.1.0"
description = "Incremental, resumable IMAP -> Prism (Elasticsearch-compatible) mailbox indexer"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "imapclient>=3.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
ssh = [
    "sshtunnel>=0.4",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
mailsync = "mailsync.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mailsync"]

[tool.pytest.ini_options]
testpaths = ["tests"]
