[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prismsearch-django"
version = "0.1.0"
description = "Django integration for Prism search engine"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "prismsearch>=0.1.0",
    "django>=4.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/prismsearch_django"]
